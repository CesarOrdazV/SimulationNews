name: Daily Business Intelligence Brief

on:
  schedule:
    # 06:00 America/Mexico_City ~= 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      reset_seen:
        description: "Reset data/seen.json before generating the brief"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-business-brief
  cancel-in-progress: false

jobs:
  update-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reset seen history (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_seen }}
        run: |
          echo "{}" > data/seen.json

      - name: Generate business intelligence brief
        run: python competitor_monitor.py

      - name: Commit and push report updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add business_intelligence_brief.md business_intelligence_brief.csv data/seen.json data/latest_by_topic.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily business intelligence brief"
          git push
